<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient: Tokyo Night Storm / Deep Obsidian -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2335" />
      <stop offset="100%" stop-color="#13141f" />
    </linearGradient>

    <!-- Squircle Border Highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Window Tile Gradient -->
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#292e42" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#1a1b26" stop-opacity="0.8" />
    </linearGradient>

    <!-- Rocket Body Gradient -->
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#c0caf5" />
      <stop offset="100%" stop-color="#7aa2f7" />
    </linearGradient>

    <!-- Rocket Shading / Right Half -->
    <linearGradient id="rocketShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d59a1" stop-opacity="0" />
      <stop offset="100%" stop-color="#1a1b26" stop-opacity="0.35" />
    </linearGradient>

    <!-- Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dcfff" />
      <stop offset="100%" stop-color="#3d59a1" />
    </linearGradient>

    <!-- Outer Flame Gradient -->
    <linearGradient id="flameOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007c" />
      <stop offset="60%" stop-color="#ff9e64" />
      <stop offset="100%" stop-color="#e0af68" stop-opacity="0" />
    </linearGradient>

    <!-- Inner Core Flame Gradient -->
    <linearGradient id="flameInner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffdc55" />
      <stop offset="100%" stop-color="#ff5555" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow Filter for Rocket -->
    <filter id="rocketShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="#090a10" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- 1. Squircle Container -->
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- 2. Hyprland Workspace Windows (Tiling Geometry) -->
  <g opacity="0.85">
    <!-- Master Window (Left) -->
    <rect x="18" y="22" width="40" height="84" rx="6" fill="url(#tileGrad)" stroke="#7aa2f7" stroke-opacity="0.3" stroke-width="1.2" />
    <!-- Window Header Accent -->
    <line x1="24" y1="30" x2="38" y2="30" stroke="#7dcfff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <circle cx="50" cy="30" r="1.5" fill="#565f89" />

    <!-- Stack Window Top-Right -->
    <rect x="64" y="22" width="46" height="38" rx="6" fill="url(#tileGrad)" stroke="#7aa2f7" stroke-opacity="0.3" stroke-width="1.2" />
    <line x1="70" y1="30" x2="82" y2="30" stroke="#bb9af7" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <circle cx="98" cy="30" r="1.5" fill="#565f89" />

    <!-- Stack Window Bottom-Right -->
    <rect x="64" y="66" width="46" height="40" rx="6" fill="url(#tileGrad)" stroke="#7aa2f7" stroke-opacity="0.3" stroke-width="1.2" />
    <line x1="70" y1="74" x2="80" y2="74" stroke="#9ece6a" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- 3. Workflow Progression Path (Connecting steps) -->
  <path d="M 38 82 Q 44 60, 68 46" fill="none" stroke="#7aa2f7" stroke-width="2" stroke-dasharray="3,3" opacity="0.4" />

  <!-- 4. Launch Rocket (Ascending 45 degrees towards top-right) -->
  <g transform="translate(68, 60) rotate(45)" filter="url(#rocketShadow)">
    <!-- Exhaust Thrust Flame -->
    <path d="M -7 18 C -11 28, -5 44, 0 54 C 5 44, 11 28, 7 18 Z" fill="url(#flameOuter)" filter="url(#neonGlow)" />
    <path d="M -3.5 18 C -5 26, -2 34, 0 40 C 2 34, 5 26, 3.5 18 Z" fill="url(#flameInner)" />

    <!-- Rocket Engine Nozzle -->
    <path d="M -5 14 L 5 14 L 6 18 L -6 18 Z" fill="#414868" stroke="#565f89" stroke-width="0.8" />

    <!-- Left Fin -->
    <path d="M -9 4 L -21 17 C -22 20, -18 21, -15 19 L -8 13 Z" fill="url(#wingGrad)" stroke="#7dcfff" stroke-width="0.8" />
    <!-- Right Fin -->
    <path d="M 9 4 L 21 17 C 22 20, 18 21, 15 19 L 8 13 Z" fill="url(#wingGrad)" stroke="#7dcfff" stroke-width="0.8" />

    <!-- Rocket Fuselage / Body -->
    <path d="M 0 -34 C -12 -12, -10 6, -9 14 L 9 14 C 10 6, 12 -12, 0 -34 Z" fill="url(#rocketBody)" />

    <!-- Right Side Body Shading for 3D Cylindrical Depth -->
    <path d="M 0 -34 C 4 -12, 7 6, 9 14 L 0 14 Z" fill="url(#rocketShade)" />

    <!-- Nose Cone Tip Highlight -->
    <path d="M 0 -34 C -3 -26, -5 -20, -6 -16 C -2 -17, 2 -17, 6 -16 C 5 -20, 3 -26, 0 -34 Z" fill="#f7768e" opacity="0.95" />

    <!-- Center Fin / Ridge Line -->
    <line x1="0" y1="-32" x2="0" y2="12" stroke="#ffffff" stroke-width="1.2" opacity="0.75" />

    <!-- Cockpit Porthole Window -->
    <circle cx="0" cy="-5" r="5" fill="#1a1b26" stroke="#7dcfff" stroke-width="1.8" />
    <circle cx="0" cy="-5" r="3.2" fill="#7dcfff" opacity="0.9" filter="url(#neonGlow)" />
    <circle cx="-1" cy="-6" r="1.2" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- 5. Dynamic Propulsion Particles / Stars -->
  <circle cx="34" cy="94" r="2.2" fill="#ff9e64" opacity="0.8" />
  <circle cx="48" cy="86" r="1.5" fill="#e0af68" opacity="0.7" />
  <circle cx="28" cy="74" r="1.2" fill="#7dcfff" opacity="0.6" />
  <circle cx="100" cy="28" r="1.6" fill="#bb9af7" opacity="0.75" />
</svg>
