<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Hyprlaunch</title>
  <desc id="desc">Hyprland tiling workspace with launch rocket arrow</desc>
  <rect width="128" height="128" rx="28" fill="#20242d"/>
  <!-- Hyprland tiling workspace frame: Master window left, Stack windows right -->
  <path d="M46 35H35v58h11M82 35h11v20M93 73v20H82" fill="none" stroke="#53d4c4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Ascending launch rocket vector -->
  <path d="M32 78l10 8 8 10M42 86l44-44M64 42h22v22" fill="none" stroke="#f5a65b" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="86" cy="42" r="5" fill="#f5a65b"/>
</svg>
