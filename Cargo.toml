[package]
name = "hyprlaunch"
version = "0.2.2"
edition = "2021"
authors = [ "Josh Andrews" ]
license = "GPL-3.0"
description = "A configurable workflow orchestrator for Hyprland"
readme = "README.md"
repository = "https://github.com/lehkost16/hyprlaunch"
keywords = [ "hyprland", "profile", "launcher", "tui" ]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
tempfile = "3.27"

[[bin]]
name = "hyprlaunch"
path = "src/main.rs" 
